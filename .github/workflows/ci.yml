# Type-checks, builds and tests every push/PR to main.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'FredrikM97/blue-prince-journal' && github.repository_owner == 'FredrikM97'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: npm ci

      - name: Validate dependency tree
        run: |
          npm ls --all --json | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const { problems = [] } = JSON.parse(input);
            if (problems.length > 0) {
              console.error(problems.join("\n"));
              process.exitCode = 1;
            } else {
              console.log("No invalid, missing, or extraneous dependencies.");
            }
          '

      - name: Lint and format check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
