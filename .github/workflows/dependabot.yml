name: Dependabot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    if: >
      github.repository == 'FredrikM97/blue-prince-journal' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false

    steps:
      - name: Wait for checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          max_wait=1800
          interval=15
          elapsed=0

          while [ "$elapsed" -lt "$max_wait" ]; do
            checks=$(gh api \
              "/repos/$REPOSITORY/commits/$SHA/check-runs?per_page=100")

            relevant_checks=$(echo "$checks" | jq --arg run_id "$RUN_ID" '
              [
                .check_runs[]
                | select(
                    .details_url == null
                    or (.details_url | contains("/actions/runs/" + $run_id) | not)
                  )
              ]
            ')

            total=$(echo "$relevant_checks" | jq 'length')

            pending=$(echo "$relevant_checks" | jq '
              [
                .[]
                | select(.conclusion == null)
              ] | length
            ')

            failed=$(echo "$relevant_checks" | jq '
              [
                .[]
                | select(
                    .conclusion != null
                    and .conclusion != "success"
                    and .conclusion != "neutral"
                    and .conclusion != "skipped"
                  )
              ] | length
            ')

            verified=$(echo "$relevant_checks" | jq '
              [
                .[]
                | select(
                    .name == "verify"
                    and .app.slug == "github-actions"
                    and .conclusion == "success"
                  )
              ] | length
            ')

            echo "Checks: $total total, $pending pending, $failed failed"

            echo "$relevant_checks" | jq -r '
              .[]
              | "\(.name): \(.conclusion // "pending")"
            '

            if [ "$failed" -gt 0 ]; then
              echo "One or more checks failed."
              exit 1
            fi

            if [ "$verified" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "All checks completed."
              exit 0
            fi

            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

          echo "Timed out after 30 minutes waiting for checks."
          exit 1

      - name: Approve pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve

      - name: Merge verified pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_URL" --squash --match-head-commit "$SHA"
