name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Update the draft or publish it"
        required: true
        type: choice
        default: update_draft
        options:
          - update_draft
          - publish
      bump:
        description: "Version bump used when publishing"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  update_draft:
    if: >-
      github.repository == 'FredrikM97/blue-prince-journal' &&
      github.repository_owner == 'FredrikM97' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'update_draft'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          RANGE="HEAD"
          if [[ -n "$LAST_TAG" ]]; then
            RANGE="${LAST_TAG}..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --no-merges --pretty=format:"- %s (%h)")
          if [[ -z "$COMMITS" ]]; then
            COMMITS="- No changes since ${LAST_TAG:-the beginning of history}"
          fi

          if [[ -n "$LAST_TAG" ]]; then
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${LAST_TAG}...main"
          else
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/commits/main"
          fi

          {
            echo "## What's Changed"
            echo
            printf '%s\n' "$COMMITS"
            echo
            echo "---"
            echo "**Full Changelog**: $COMPARE_URL"
          } > release-notes.md

      - name: Update rolling draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view unreleased >/dev/null 2>&1; then
            gh release edit unreleased \
              --title "Unreleased" \
              --notes-file release-notes.md \
              --target main \
              --draft
          else
            gh release create unreleased \
              --title "Unreleased" \
              --notes-file release-notes.md \
              --target main \
              --draft
          fi

  publish:
    if: >-
      github.repository == 'FredrikM97/blue-prince-journal' &&
      github.repository_owner == 'FredrikM97' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'publish'
    runs-on: ubuntu-latest
    environment: cloudflare-pages
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require an existing draft to publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view unreleased >/dev/null 2>&1; then
            echo "::error::No draft release found. Push to main or run the workflow with 'update_draft' first."
            exit 1
          fi

      - name: Determine next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          BASE="${LAST_TAG#v}"
          BASE="${BASE:-0.0.0}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::Unsupported version bump: $BUMP"; exit 1 ;;
          esac
          TAG="v$MAJOR.$MINOR.$PATCH"

          gh release view unreleased --json body -q .body > release-notes.md
          sed -i "s#\\.\\.\\.main#...${TAG}#g; s#/commits/main#/commits/${TAG}#g" release-notes.md

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release edit unreleased \
            --tag "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            --target main \
            --draft=false \
            --latest

      - name: Trigger Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"
