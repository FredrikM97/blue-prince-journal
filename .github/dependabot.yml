
version: 2

updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(package)"
    labels:
      - "dependencies"
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(workflow)"
    labels:
      - "dependencies"
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dev Container Features
  - package-ecosystem: "devcontainers"
    directory: "/.devcontainer"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(devcontainer)"
    labels:
      - "dependencies"
